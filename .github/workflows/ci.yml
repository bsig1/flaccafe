name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Prepare packaging venv
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r backend\requirements.txt pyinstaller

      - name: TypeScript check
        run: npm run check

      - name: Frontend interaction tests
        run: npm run test:frontend

      - name: Backend tests
        run: python -m unittest discover backend/tests

      - name: Frontend production build
        run: npm run build

      - name: Changelog preview
        run: powershell -ExecutionPolicy Bypass -File scripts/changelog_preview.ps1

      - name: Installer smoke test
        run: powershell -ExecutionPolicy Bypass -File scripts/installer_smoke.ps1

      - name: Optional CLAP runtime validation
        run: powershell -ExecutionPolicy Bypass -File scripts/validate_clap_runtime.ps1

      - name: Python compile check
        run: python -m compileall backend

      - name: Rust check
        working-directory: src-tauri
        run: cargo check

      - name: Build MSI
        run: npm run package:msi

      - name: MSI install/uninstall round-trip
        run: powershell -ExecutionPolicy Bypass -File scripts/ci_installer_roundtrip.ps1

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: flac-cafe-msi
          path: src-tauri/target/release/bundle/msi/*.msi
