[package]
name = "flac-cafe"
version = "0.5.0"
description = "A local music recommendation prototype"
authors = ["FLAC Cafe contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.61.3", features = ["Foundation", "Media", "Win32_Foundation", "Win32_System_WinRT"] }
rodio = { version = "0.22.2", features = ["symphonia-all"] }
