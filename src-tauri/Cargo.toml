[package]
name = "flac-cafe"
version = "0.5.0"
description = "A smart local music player and AutoDJ for downloaded collections"
authors = ["FLAC Cafe contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
base64 = "0.22"
sha1 = "0.10"
time = { version = "0.3", features = ["formatting"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
windows = { version = "0.61.3", features = ["Foundation", "Media", "Win32_Foundation", "Win32_System_WinRT", "Win32_UI_Shell"] }
rodio = { version = "0.22.2", features = ["symphonia-all"] }
notify = "6.1.1"
rusqlite = { version = "0.32.1", features = ["bundled"] }
