[package]
name = "flac-cafe"
version = "0.6.0"
description = "A smart local music player and AutoDJ for downloaded collections"
authors = ["FLAC Cafe contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
csv = "1"
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
md5 = "0.7"
plist = "1"
roxmltree = "0.20"
trash = "5"
urlencoding = "2"
time = { version = "0.3", features = ["formatting"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
ureq = { version = "2", features = ["json"] }
rodio = { version = "0.22.2", features = ["symphonia-all"] }
notify = "6.1.1"
rusqlite = { version = "0.32.1", features = ["bundled"] }
lofty = "0.24"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Foundation", "Media", "Win32_Devices_Cdrom", "Win32_Devices_Properties", "Win32_Foundation", "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
